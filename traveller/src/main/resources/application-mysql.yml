spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/travel_assistant?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:travel_user}
    password: ${DATABASE_PASSWORD:travel_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
