<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Travel Lion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/mobile.css}" rel="stylesheet">
    <style>
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .login-body .phone-content {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: 16px;
        }
        .login-card {
            width: 100%;
            background: #fff;
            border-radius: 16px;
            padding: 24px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .brand-logo {
            color: var(--hsbc-red);
            font-weight: 700;
            font-size: 1.4rem;
            text-align: center;
        }
    </style>
</head>
<body class="login-body">
<div class="phone-shell">
    <div class="phone-notch"></div>

    <main class="phone-content">
        <div class="login-card">
            <div class="text-center mb-4">
                <div class="brand-logo"><i class="bi bi-airplane-fill me-2"></i>Travel Lion</div>
                <p class="text-muted small mt-2 mb-0">Global Safety Pass</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-hsbc w-100 py-2">Sign In</button>
            </form>

            <p class="text-muted text-center small mt-3 mb-0">Demo: admin / admin123</p>
        </div>
    </main>
</div>
</body>
</html>
