<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Spending Dashboard - Travel Lion</title>
</head>
<body>
<section>
    <div class="page-title" th:text="${trip.destination}"></div>
    <div class="page-subtitle">Phase 2: Payment Tracking</div>

    <div class="stat-grid">
        <div class="stat-card">
            <div class="label">Budget</div>
            <div class="value" th:text="${dashboard.budget}"></div>
        </div>
        <div class="stat-card">
            <div class="label">Spent</div>
            <div class="value text-danger" th:text="${dashboard.totalSpent}"></div>
        </div>
        <div class="stat-card">
            <div class="label">Remaining</div>
            <div class="value text-success" th:text="${dashboard.remaining}"></div>
        </div>
        <div class="stat-card">
            <div class="label">Transactions</div>
            <div class="value" th:text="${dashboard.transactionCount}"></div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header bg-white py-2">
            <h6 class="mb-0 small"><i class="bi bi-plus-circle me-1"></i>Record Payment</h6>
        </div>
        <div class="card-body p-3">
            <form id="paymentForm">
                <input type="hidden" id="tripId" th:value="${trip.id}">
                <div class="mb-2">
                    <label class="form-label small">Payment Card</label>
                    <select class="form-select form-select-sm" id="cardId" required>
                        <option th:each="c : ${cards}" th:value="${c.id}"
                                th:text="${c.cardName + ' (' + c.maskedNumber + ')'}"></option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Merchant</label>
                    <input type="text" class="form-control form-control-sm" id="merchant" placeholder="e.g. Ginza Store" required>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small">Amount</label>
                        <input type="number" step="0.01" class="form-control form-control-sm" id="amount" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Currency</label>
                        <input type="text" class="form-control form-control-sm" id="currency" th:value="${trip.currency}">
                    </div>
                </div>
                <div class="row g-2 mb-2">
                    <div class="col-6">
                        <label class="form-label small">Exchange Rate</label>
                        <input type="number" step="0.0001" class="form-control form-control-sm" id="exchangeRate" value="1.0">
                    </div>
                    <div class="col-6">
                        <label class="form-label small">Category</label>
                        <select class="form-select form-select-sm" id="category">
                            <option th:each="cat : ${categories}" th:value="${cat.name()}" th:text="${cat.name()}"></option>
                        </select>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="form-label small">Location</label>
                    <input type="text" class="form-control form-control-sm" id="location" th:placeholder="${trip.destination}">
                </div>
                <div class="mb-3">
                    <label class="form-label small">Simulate Failure</label>
                    <select class="form-select form-select-sm" id="simulateFailure">
                        <option value="">Normal payment</option>
                        <option value="INSUFFICIENT_BALANCE">Insufficient balance</option>
                        <option value="CARD_FROZEN">Card frozen</option>
                        <option value="LIMIT_EXCEEDED">Limit exceeded</option>
                        <option value="OVERSEAS_DISABLED">Overseas disabled</option>
                        <option value="CARD_EXPIRED">Card expired</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-hsbc w-100 btn-sm py-2">Submit Payment</button>
            </form>
            <div id="paymentResult" class="mt-2"></div>
        </div>
    </div>

    <div class="card mb-3" th:if="${!dashboard.categoryBreakdown.isEmpty()}">
        <div class="card-header bg-white py-2"><h6 class="mb-0 small">Spending by Category</h6></div>
        <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between small py-2" th:each="entry : ${dashboard.categoryBreakdown}">
                <span th:text="${entry.key}"></span>
                <span class="fw-semibold" th:text="${entry.value + ' ' + dashboard.currency}"></span>
            </li>
        </ul>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h6 class="fw-semibold mb-0 small"><i class="bi bi-receipt me-1"></i>Transactions</h6>
        <button class="btn btn-sm btn-outline-secondary" onclick="location.reload()">Refresh</button>
    </div>

    <div th:if="${#lists.isEmpty(transactions)}" class="text-center py-4 text-muted small">No transactions yet</div>

    <div th:each="txn : ${transactions}" class="trip-card">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <div class="fw-semibold small" th:text="${txn.merchant}"></div>
                <div class="text-muted" style="font-size:0.7rem">
                    <span th:text="${txn.category}"></span> |
                    <span th:text="${#temporals.format(txn.transactionTime, 'MM-dd HH:mm')}"></span>
                </div>
            </div>
            <div class="text-end">
                <div class="fw-bold small" th:text="${txn.amount + ' ' + txn.currency}"></div>
                <span th:if="${txn.status.name() == 'SUCCESS'}" class="badge bg-success">OK</span>
                <span th:if="${txn.status.name() == 'FAILED'}" class="badge bg-danger">Failed</span>
            </div>
        </div>
        <div th:if="${txn.status.name() == 'FAILED'}" class="alert alert-danger mt-2 mb-0 py-1 small" style="font-size:0.7rem">
            <strong th:text="${txn.failureCode}"></strong>:
            <span th:text="${txn.failureMessage}"></span>
        </div>
    </div>

    <a th:href="@{/trips/{id}/readiness(id=${trip.id})}" class="btn btn-outline-primary w-100 mt-2 btn-sm">Back to Readiness</a>
</section>
</body>
</html>
