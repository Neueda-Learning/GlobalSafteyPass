<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title th:replace="${title}">Travel Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/mobile.css}" rel="stylesheet">
</head>
<body>
<div class="phone-shell">
    <div class="phone-notch"></div>

    <header class="phone-header">
        <a class="brand" href="/"><i class="bi bi-airplane-fill me-1"></i>Travel Lion</a>
    </header>

    <main class="phone-content">
        <div th:replace="${content}">Content</div>
    </main>

    <nav class="phone-nav">
        <a href="/" data-nav="/">
            <i class="bi bi-house-fill"></i>
            <span>Home</span>
        </a>
        <a href="/trips/new" data-nav="/trips/new">
            <i class="bi bi-plus-circle-fill"></i>
            <span>New Trip</span>
        </a>
        <a href="/alerts" data-nav="/alerts">
            <i class="bi bi-shield-fill"></i>
            <span>Security</span>
        </a>
        <a href="/logout">
            <i class="bi bi-box-arrow-right"></i>
            <span>Logout</span>
        </a>
    </nav>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
