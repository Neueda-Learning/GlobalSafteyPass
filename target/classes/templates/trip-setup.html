<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Create Trip - Travel Lion</title>
</head>
<body>
<section>
    <div class="page-title"><i class="bi bi-geo-alt me-1"></i> Create Trip</div>
    <div class="page-subtitle">Phase 1: Trip Setup &amp; Readiness Check</div>

    <div th:if="${error}" class="alert alert-danger small py-2" th:text="${error}"></div>

    <form th:action="@{/trips}" th:object="${tripRequest}" method="post">
        <div class="mb-3">
            <label class="form-label">Destination</label>
            <input type="text" class="form-control" th:field="*{destination}" placeholder="e.g. Tokyo, Japan" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('destination')}" th:errors="*{destination}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Currency</label>
            <select class="form-select" th:field="*{currency}" required>
                <option value="CNY">CNY - Chinese Yuan</option>
                <option value="USD">USD - US Dollar</option>
                <option value="EUR">EUR - Euro</option>
                <option value="JPY">JPY - Japanese Yen</option>
                <option value="GBP">GBP - British Pound</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Departure Date</label>
            <input type="date" class="form-control" th:field="*{startDate}" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Return Date</label>
            <input type="date" class="form-control" th:field="*{endDate}" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Budget</label>
            <input type="number" step="0.01" class="form-control" th:field="*{budget}" placeholder="10000" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('budget')}" th:errors="*{budget}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Preferred Card</label>
            <select class="form-select" th:field="*{preferredCardId}" required>
                <option value="">Select a card</option>
                <option th:each="card : ${cards}" th:value="${card.id}"
                        th:text="${card.cardName + ' (' + card.maskedNumber + ')'}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-hsbc w-100 py-2 mb-2">Create &amp; Check Readiness</button>
        <a href="/" class="btn btn-outline-secondary w-100">Cancel</a>
    </form>
</section>
</body>
</html>
